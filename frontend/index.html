<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mario Jumper</title>

    <link rel="stylesheet" href="./css/style.css" />
    <script src="./js/script.js" defer></script>
  </head>
  <body>
    <div class="game-board">
      <div class="score">Pontos: <span id="score-value">0</span></div>

      <img src="./images/pipe.png" class="pipe">
      <img src="./images/mario.gif" class="mario">
      <img src="./images/clouds.png" class="clouds">
      <div class="ground"></div>

      <div class="overlay" id="start-screen">
        <h1>Mario Jumper</h1>
        <p>Pressione ESPAÇO para pular</p>
        <button id="start-btn">Começar</button>
      </div>

      <div class="overlay hidden" id="gameover-screen">
        <h1>Game Over</h1>
        <p>Pontuação final: <span id="final-score">0</span></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <audio id="bg-music" loop>
      <source src="./media/mario-music.ogg" type="audio/ogg">
      <source src="./media/mario-music.mp3" type="audio/mpeg">
    </audio>
  </body>
</html>
